<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Nova Atividade</title>

<style>

body{
    min-height: 100vh;
    background-color: #212529;
    display: flex;
    align-items: center;
}

.form-container{
    width: 100%;
    max-width: 800px;
    margin: auto;
}

.card-form{
    background: #2b3035;
    border-radius: 20px;
}

.logo{
    width: 90px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card card-form shadow-lg p-5">

        <!-- TOPO -->
        <div class="text-center mb-4">

            <img src="logo.png2.png"
                 class="logo mb-3">

            <h2 class="fw-bold">
                Nova Atividade 📚
            </h2>

            <p class="text-secondary">
                Cadastre e organize suas tarefas acadêmicas
            </p>

        </div>

        <!-- FORM -->
        <form id="formAtividade">

            <div class="row">

                <!-- TÍTULO -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Título
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="titulo"
                        placeholder="Ex: Trabalho de Matemática"
                        required>

                </div>

                <!-- DISCIPLINA -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Disciplina
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="disciplina"
                        placeholder="Ex: Matemática"
                        required>

                </div>

            </div>

            <div class="row">

                <!-- DATA -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Data de entrega
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="data"
                        required>

                </div>

                <!-- PRIORIDADE -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Prioridade
                    </label>

                    <select
                        class="form-select"
                        id="prioridade"
                        required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Alta">
                            🔴 Alta
                        </option>

                        <option value="Média">
                            🟡 Média
                        </option>

                        <option value="Baixa">
                            🟢 Baixa
                        </option>

                    </select>

                </div>

            </div>

            <!-- DESCRIÇÃO -->
            <div class="mb-4">

                <label class="form-label">
                    Descrição
                </label>

                <textarea
                    class="form-control"
                    id="descricao"
                    rows="4"
                    placeholder="Descreva a atividade..."
                    required></textarea>

            </div>

            <!-- BOTÕES -->
            <div class="d-flex gap-3">

                <button
                    type="submit"
                    class="btn btn-success flex-fill py-2">

                    Salvar atividade

                </button>

                <a href="dashboard.html"
                   class="btn btn-outline-light flex-fill py-2">

                    Voltar ao dashboard

                </a>

            </div>

        </form>

    </div>

</div>

<script>

const form =
    document.getElementById("formAtividade");

const editarId =
    localStorage.getItem("editarId");

let atividades =
    JSON.parse(localStorage.getItem("atividades")) || [];


// EDITAR
if(editarId){

    let atividade =
        atividades.find(a => a.id == editarId);

    if(atividade){

        document.getElementById("titulo")
            .value = atividade.titulo;

        document.getElementById("disciplina")
            .value = atividade.disciplina;

        document.getElementById("data")
            .value = atividade.data;

        document.getElementById("prioridade")
            .value = atividade.prioridade;

        document.getElementById("descricao")
            .value = atividade.descricao;

    }

}


// SALVAR
form.addEventListener("submit", function(e){

    e.preventDefault();

    let titulo =
        document.getElementById("titulo").value;

    let disciplina =
        document.getElementById("disciplina").value;

    let data =
        document.getElementById("data").value;

    let prioridade =
        document.getElementById("prioridade").value;

    let descricao =
        document.getElementById("descricao").value;

    // NOVA ATIVIDADE
    let novaAtividade = {

        id: Date.now(),

        titulo,
        disciplina,
        data,
        prioridade,
        descricao,

        concluida: false

    };

    // EDITAR
    if(editarId){

        let index =
            atividades.findIndex(
                a => a.id == editarId
            );

        novaAtividade.id =
            Number(editarId);

        novaAtividade.concluida =
            atividades[index].concluida;

        atividades[index] =
            novaAtividade;

        localStorage.removeItem("editarId");

    }else{

        atividades.push(novaAtividade);

    }

    localStorage.setItem(
        "atividades",
        JSON.stringify(atividades)
    );

    alert("Atividade salva com sucesso! ✅");

    window.location.href =
        "dashboard.html";

});

</script>

</body>
</html>
