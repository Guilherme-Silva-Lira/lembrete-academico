<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Dashboard</title>

<style>

body{
    min-height: 100vh;
}

.container-box{
    max-width: 1100px;
    margin: auto;
}

.card{
    border-radius: 15px;
    transition: 0.2s;
}

.card:hover{
    transform: scale(1.01);
}

.atrasada{
    border: 2px solid #dc3545;
}

.stats-card{
    text-align: center;
    padding: 20px;
}

.stats-number{
    font-size: 2rem;
    font-weight: bold;
}

.search-box{
    max-width: 400px;
}

</style>

</head>

<body class="bg-body-tertiary">

<div class="container py-5 container-box">

    <!-- TOPO -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Dashboard Acadêmico
        </h1>

        <p class="text-secondary">
            Organize suas atividades 📚
        </p>

    </div>

    <!-- ESTATÍSTICAS -->
    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <div class="card stats-card shadow-sm">

                <div class="stats-number" id="totalAtividades">
                    0
                </div>

                <p>Total</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card stats-card shadow-sm">

                <div class="stats-number text-warning"
                     id="pendentes">
                    0
                </div>

                <p>Pendentes</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card stats-card shadow-sm">

                <div class="stats-number text-danger"
                     id="atrasadas">
                    0
                </div>

                <p>Atrasadas</p>

            </div>

        </div>

    </div>

    <!-- CONTROLES -->
    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">

        <a href="atividade.html"
           class="btn btn-success">

           + Nova atividade

        </a>

        <input
            type="text"
            id="pesquisa"
            class="form-control search-box"
            placeholder="Pesquisar atividade..."
            onkeyup="carregarAtividades()">

        <a href="index.html"
           class="btn btn-outline-light">

           Sair

        </a>

    </div>

    <!-- ALERTA -->
    <div id="alerta"></div>

    <!-- LISTA -->
    <div id="listaAtividades"></div>

</div>

<script>

function formatarData(data){

    return new Date(data)
        .toLocaleDateString("pt-BR");

}

function carregarAtividades(){

    let atividades =
        JSON.parse(localStorage.getItem("atividades")) || [];

    let container =
        document.getElementById("listaAtividades");

    let pesquisa =
        document.getElementById("pesquisa").value
        .toLowerCase();

    container.innerHTML = "";

    let total = atividades.length;
    let atrasadas = 0;

    document.getElementById("totalAtividades")
        .innerText = total;

    if(total === 0){

        container.innerHTML = `
            <div class="text-center mt-5">
                <h5 class="text-secondary">
                    Nenhuma atividade cadastrada 😢
                </h5>
            </div>
        `;

        return;

    }

    atividades.forEach((atividade, index) => {

        if(
            !atividade.titulo.toLowerCase()
            .includes(pesquisa)
        ){
            return;
        }

        let hoje = new Date();
        let dataEntrega = new Date(atividade.data);

        let atrasada = dataEntrega < hoje;

        if(atrasada){
            atrasadas++;
        }

        let classe =
            atrasada ? "atrasada" : "";

        let status =
            atrasada
            ? `<span class="badge bg-danger">
                    Atrasada
               </span>`
            : `<span class="badge bg-success">
                    Em dia
               </span>`;

        let card = `

        <div class="card shadow-sm p-4 mb-4 ${classe}">

            <div class="d-flex justify-content-between flex-wrap gap-3">

                <div>

                    <h4>${atividade.titulo}</h4>

                    <p class="text-secondary">
                        ${atividade.descricao}
                    </p>

                    <p>
                        <strong>Disciplina:</strong>
                        ${atividade.disciplina}
                    </p>

                    <p>
                        <strong>Entrega:</strong>
                        ${formatarData(atividade.data)}
                    </p>

                    <p>
                        <strong>Prioridade:</strong>
                        ${atividade.prioridade}
                    </p>

                    ${status}

                </div>

                <!-- BOTÕES -->
                <div class="d-flex gap-2">

                    <button
                        class="btn btn-warning"
                        onclick="editarAtividade(${index})">

                        ✏️

                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="excluirAtividade(${index})">

                        🗑️

                    </button>

                </div>

            </div>

        </div>

        `;

        container.innerHTML += card;

    });

    document.getElementById("atrasadas")
        .innerText = atrasadas;

    document.getElementById("pendentes")
        .innerText = total - atrasadas;

    mostrarAlertas(atrasadas);

}

function mostrarAlertas(atrasadas){

    let alerta =
        document.getElementById("alerta");

    if(atrasadas > 0){

        alerta.innerHTML = `

        <div class="alert alert-danger">

            Você possui
            <strong>${atrasadas}</strong>
            atividade(s) atrasada(s)!

        </div>

        `;

    }else{

        alerta.innerHTML = "";

    }

}

function excluirAtividade(index){

    let atividades =
        JSON.parse(localStorage.getItem("atividades")) || [];

    let confirmar =
        confirm("Deseja excluir esta atividade?");

    if(confirmar){

        atividades.splice(index, 1);

        localStorage.setItem(
            "atividades",
            JSON.stringify(atividades)
        );

        carregarAtividades();

    }

}

function editarAtividade(index){

    localStorage.setItem(
        "editarIndex",
        index
    );

    window.location.href = "atividade.html";

}

carregarAtividades();

</script>

</body>
</html>
