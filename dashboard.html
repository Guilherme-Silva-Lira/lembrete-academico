<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Dashboard</title>

<style>

body{
    min-height: 100vh;
    background:  #212529;
}

.container-box{
    max-width: 1200px;
    margin: auto;
}

.card{
    border-radius: 18px;
    transition: 0.2s;
    border: none;
}

.card:hover{
    transform: translateY(-3px);
}

.stats-card{
    text-align: center;
    padding: 25px;
}

.stats-number{
    font-size: 2rem;
    font-weight: bold;
}

.search-box{
    max-width: 400px;
}

.badge-prioridade{
    font-size: 0.8rem;
    padding: 8px 12px;
    border-radius: 20px;
}

.prioridade-alta{
    background-color: #dc3545;
}

.prioridade-media{
    background-color: #ffc107;
    color: black;
}

.prioridade-baixa{
    background-color: #198754;
}

.atrasada{
    border-left: 8px solid #dc3545;
}

.em-dia{
    border-left: 8px solid #198754;
}

.card-atividade{
    background: #2a2a40;
}

.topbar{
    background:  #212529;
    border-radius: 18px;
    padding: 20px;
}

</style>

</head>

<body>

<div class="container py-5 container-box">

    <!-- TOPO -->
    <div class="topbar shadow mb-5">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

            <div>

                <h1 class="fw-bold mb-1">
                    Dashboard Acadêmico 📚
                </h1>

                <p class="text-secondary mb-0">
                    Organize suas atividades e prioridades
                </p>

            </div>

            <div class="d-flex gap-2">

                <a href="atividade.html"
                   class="btn btn-success">

                    + Nova atividade

                </a>

                <a href="index.html"
                   class="btn btn-outline-light">

                    Sair

                </a>

            </div>

        </div>

    </div>

    <!-- ESTATÍSTICAS -->
    <div class="row g-4 mb-5">

        <div class="col-md-3">

            <div class="card stats-card shadow">

                <div class="stats-number"
                     id="totalAtividades">

                    0

                </div>

                <p>Total</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card stats-card shadow">

                <div class="stats-number text-warning"
                     id="pendentes">

                    0

                </div>

                <p>Pendentes</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card stats-card shadow">

                <div class="stats-number text-danger"
                     id="atrasadas">

                    0

                </div>

                <p>Atrasadas</p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card stats-card shadow">

                <div class="stats-number text-success"
                     id="emDia">

                    0

                </div>

                <p>Em dia</p>

            </div>

        </div>

    </div>

    <!-- PESQUISA -->
    <div class="mb-4">

        <input
            type="text"
            id="pesquisa"
            class="form-control search-box"
            placeholder="Pesquisar atividade..."
            onkeyup="carregarAtividades()">

    </div>

    <!-- ALERTA -->
    <div id="alerta"></div>

    <!-- LISTA -->
    <div id="listaAtividades"></div>

</div>

<script>

function formatarData(data){

    return new Date(data)
        .toLocaleDateString("pt-BR");

}

function prioridadeValor(prioridade){

    if(prioridade === "Alta") return 1;
    if(prioridade === "Média") return 2;

    return 3;

}

function classePrioridade(prioridade){

    if(prioridade === "Alta")
        return "prioridade-alta";

    if(prioridade === "Média")
        return "prioridade-media";

    return "prioridade-baixa";

}

function carregarAtividades(){

    let atividades =
        JSON.parse(localStorage.getItem("atividades")) || [];

    let container =
        document.getElementById("listaAtividades");

    let pesquisa =
        document.getElementById("pesquisa")
        .value
        .toLowerCase();

    container.innerHTML = "";

    // ORDENAR
    atividades.sort((a, b) => {

        let prioridade =
            prioridadeValor(a.prioridade)
            -
            prioridadeValor(b.prioridade);

        if(prioridade !== 0)
            return prioridade;

        return new Date(a.data)
            -
            new Date(b.data);

    });

    let total = atividades.length;

    let atrasadas = 0;
    let emDia = 0;

    document.getElementById("totalAtividades")
        .innerText = total;

    if(total === 0){

        container.innerHTML = `

        <div class="text-center mt-5">

            <h4 class="text-secondary">

                Nenhuma atividade cadastrada 😢

            </h4>

        </div>

        `;

        return;

    }

    atividades.forEach((atividade, index) => {

        if(
            !atividade.titulo
            .toLowerCase()
            .includes(pesquisa)
        ){
            return;
        }

        let hoje = new Date();

        hoje.setHours(0,0,0,0);

        let dataEntrega =
            new Date(atividade.data);

        let atrasada =
            dataEntrega < hoje;

        if(atrasada){

            atrasadas++;

        }else{

            emDia++;

        }

        let classe =
            atrasada
            ? "atrasada"
            : "em-dia";

        let status =
            atrasada
            ? `<span class="badge bg-danger">
                    Atrasada
               </span>`
            : `<span class="badge bg-success">
                    Em dia
               </span>`;

        let prioridadeClasse =
            classePrioridade(
                atividade.prioridade
            );

        let card = `

        <div class="card card-atividade shadow p-4 mb-4 ${classe}">

            <div class="d-flex justify-content-between flex-wrap gap-4">

                <div class="flex-grow-1">

                    <div class="d-flex align-items-center gap-2 mb-2">

                        <h3 class="mb-0">

                            ${atividade.titulo}

                        </h3>

                        <span class="badge badge-prioridade ${prioridadeClasse}">

                            ${atividade.prioridade}

                        </span>

                    </div>

                    <p class="text-secondary">

                        ${atividade.descricao}

                    </p>

                    <div class="d-flex flex-wrap gap-4 mt-3">

                        <p class="mb-0">

                            📘
                            <strong>Disciplina:</strong>
                            ${atividade.disciplina}

                        </p>

                        <p class="mb-0">

                            📅
                            <strong>Entrega:</strong>
                            ${formatarData(atividade.data)}

                        </p>

                    </div>

                    <div class="mt-3">

                        ${status}

                    </div>

                </div>

                <!-- BOTÕES -->
                <div class="d-flex gap-2 align-items-start">

                    <button
                        class="btn btn-warning"
                        onclick="editarAtividade(${index})">

                        ✏️

                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="excluirAtividade(${index})">

                        🗑️

                    </button>

                </div>

            </div>

        </div>

        `;

        container.innerHTML += card;

    });

    document.getElementById("atrasadas")
        .innerText = atrasadas;

    document.getElementById("pendentes")
        .innerText = total - atrasadas;

    document.getElementById("emDia")
        .innerText = emDia;

    mostrarAlertas(atrasadas);

}

function mostrarAlertas(atrasadas){

    let alerta =
        document.getElementById("alerta");

    if(atrasadas > 0){

        alerta.innerHTML = `

        <div class="alert alert-danger shadow-sm">

            ⚠️ Você possui
            <strong>${atrasadas}</strong>
            atividade(s) atrasada(s)!

        </div>

        `;

    }else{

        alerta.innerHTML = "";

    }

}

function excluirAtividade(index){

    let atividades =
        JSON.parse(localStorage.getItem("atividades")) || [];

    let confirmar =
        confirm("Deseja excluir esta atividade?");

    if(confirmar){

        atividades.splice(index, 1);

        localStorage.setItem(
            "atividades",
            JSON.stringify(atividades)
        );

        carregarAtividades();

    }

}

function editarAtividade(index){

    localStorage.setItem(
        "editarIndex",
        index
    );

    window.location.href =
        "atividade.html";

}

carregarAtividades();

</script>

</body>
</html>
